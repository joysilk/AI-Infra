<style id="page-css">
/* Layout: 서버 랙(rack) 비유. 위쪽 랙 개요에서 단계별 진도를 LED로 보고, 아래에 단계(U01~U11)가 순서대로 이어진다. */
:root {
  --bg: #eef2f4; --panel: #ffffff; --fg: #14202a; --muted: #566572; --line: #d3dce2;

  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1317; --panel: #141c22; --fg: #e2e9ee; --muted: #93a2ad; --line: #26333c;
  --accent: #52b6d8; --accent-soft: #15303b;
  --led-on: #39cc78; --led-wip: #f0a72e; --led-off: #3a4852;
  --rack: #0a0f12; --rack-fg: #d9e3ea; --rack-line: #24313a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1317; --panel: #141c22; --fg: #e2e9ee; --muted: #93a2ad; --line: #26333c;
  --accent: #52b6d8; --accent-soft: #15303b;
  --led-on: #39cc78; --led-wip: #f0a72e; --led-off: #3a4852;
  --rack: #0a0f12; --rack-fg: #d9e3ea; --rack-line: #24313a; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 120px; display: grid; gap: 40px; }

h1 { font-size: clamp(26px, 4.4vw, 38px); font-weight: 700; letter-spacing: -0.01em; }

a { color: var(--accent); }

/* Header */
header.top { display: grid; gap: 14px; }
.lede { max-width: 62ch; color: var(--muted); }
.modebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }

.ghost { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
.ghost:hover { border-color: var(--accent); }

.rack { background: var(--rack); color: var(--rack-fg); border-radius: 10px; padding: 14px; display: grid; gap: 6px; overflow-x: auto; }

.meter i { display: block; height: 100%; background: var(--led-on); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #8fa0ac; padding: 6px 6px 0; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

.module { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; scroll-margin-top: 16px; }
.mod-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }

dt { font-weight: 700; font-size: 14px; }

.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.project .tools { display: flex; flex-wrap: wrap; gap: 6px; }
.project .tools span { font-family: var(--font-mono); font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

.field input[type=url], textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.note-view { white-space: pre-wrap; font-size: 14px; background: var(--bg); border-radius: 6px; padding: 12px 14px; overflow-wrap: anywhere; }
.note-empty { font-size: 13px; color: var(--muted); }

/* Save bar */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--rack); color: var(--rack-fg); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 20; font-size: 14px; }
.savebar button { border: 0; border-radius: 8px; padding: 8px 16px; background: var(--led-on); color: #06140c; font-weight: 700; }
.savebar button.sec { background: transparent; color: var(--rack-fg); border: 1px solid var(--rack-line); font-weight: 500; }
.savebar button:disabled { opacity: 0.6; cursor: default; }

footer { font-size: 13px; color: var(--muted); }

@media (max-width: 760px) {

  .col + .col { border-left: 0; border-top: 1px solid var(--line); }

  .mod-head .status { grid-column: 2; }
  .col { padding: 18px 16px 20px; }
}
@media (prefers-reduced-motion: no-preference) { .led, .meter i { transition: background .2s, width .3s; } }

        doneWhen: "설계 문서, 비용 계산표, 동작하는 축소 구현, 데모 영상, 회고가 하나의 저장소에 있다.",
        cost: "축소 구현은 로컬로. 클라우드 데모는 몇 시간만 띄우고 삭제" } }
  ];

  const stateEl = document.getElementById("state");
  let saved;
  try { saved = JSON.parse(stateEl.textContent); } catch (e) { saved = {}; }
  const blank = { checks: {}, notes: {}, links: {}, updated: "" };
  let state = Object.assign({}, blank, saved);
  state.checks = Object.assign({}, state.checks); state.notes = Object.assign({}, state.notes); state.links = Object.assign({}, state.links);
  const savedJSON = JSON.stringify(state);

  let mode = "view";       // view | edit | local
  let preview = false;     // 편집자가 '남이 보는 화면' 미리보기
  let artifactApi = null;
  let saving = false;
  let message = "";
  const PENDING_KEY = "ai-infra-course-pending";

  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function moduleProgress(m) {
    const total = m.checks.length;
    let done = 0;
    m.checks.forEach((_, i) => { if (state.checks[m.id + "-" + i]) done++; });
    return { done, total, pct: Math.round(done / total * 100) };
  }
  function ledClass(p) { return p.done === 0 ? "" : p.done === p.total ? "on" : "wip"; }
  function statusText(p) { return p.done === 0 ? "시작 전" : p.done === p.total ? "완료" : "진행 중"; }
  const dirty = () => JSON.stringify(state) !== savedJSON;
  const editable = () => (mode === "edit" || mode === "local") && !preview;

  function render() {
    const totalWeeks = MODULES.reduce((a, m) => a + m.weeks, 0);
    let allDone = 0, allTotal = 0, doneMods = 0;
    MODULES.forEach(m => { const p = moduleProgress(m); allDone += p.done; allTotal += p.total; if (p.done === p.total) doneMods++; });
    const pct = Math.round(allDone / allTotal * 100);

    const modeChip = editable()
      ? '<span class="chip edit">편집 중: 체크와 노트는 저장 버튼을 눌러야 남아요</span>'
      : '<span class="chip">읽기 전용 보기</span>';
    const previewBtn = (mode === "edit" || mode === "local")
      ? '<button class="ghost" id="toggle-preview" type="button">' + (preview ? "편집 화면으로 돌아가기" : "다른 사람이 보는 화면 미리보기") + "</button>"
      : "";

    let html = '<div class="wrap">';
    html += '<header class="top"><span class="label">학습 기록 · 총 ' + MODULES.length + "단계 · 약 " + totalWeeks + "주</span>" +
      "<h1>AI 인프라 운영 및 설계</h1>" +
      '<p class="lede">GPU 서버 운영부터 LLM 서빙, 플랫폼 설계까지 단계별로 공부하고, 단계마다 실습 프로젝트를 하나씩 완성하며 배운 내용을 정리해 두는 기록장입니다.</p>' +
      '<div class="modebar">' + modeChip + previewBtn +
      (state.updated ? '<span class="chip">마지막 저장 ' + esc(state.updated) + "</span>" : "") + "</div></header>";

    html += '<nav class="rack" aria-label="단계별 진도"><div class="rack-head"><span>COURSE RACK · ' + MODULES.length + 'U</span><span>체크 <b>' + allDone + "/" + allTotal + "</b> · 완료 단계 <b>" + doneMods + "/" + MODULES.length + "</b> · 전체 <b>" + pct + "%</b></span></div>";
    MODULES.forEach(m => {
      const p = moduleProgress(m);
      html += '<a class="unit" href="#' + m.id + '"><span class="u">' + m.id.toUpperCase() + '</span><span class="led ' + ledClass(p) + '"></span><span class="t">' + esc(m.title) + '</span><span class="w">' + m.weeks + '주</span><span class="meter"><i style="width:' + p.pct + '%"></i></span></a>';
    });
    html += '<div class="legend"><span><i class="led"></i>시작 전</span><span><i class="led wip"></i>진행 중</span><span><i class="led on"></i>완료</span></div></nav>';

    MODULES.forEach(m => {
      const p = moduleProgress(m);
      html += '<section class="module" id="' + m.id + '"><div class="mod-head"><span class="u">' + m.id.toUpperCase() + "</span><div><h2>" + esc(m.title) + '</h2><div class="meta">권장 ' + m.weeks + "주 · 체크 " + p.done + "/" + p.total + '</div></div><span class="status"><i class="led ' + ledClass(p) + '"></i>' + statusText(p) + "</span></div>";
      html += '<div class="mod-body"><div class="col">';
      html += '<div class="field"><span class="label">왜 배우나</span><p class="why">' + esc(m.why) + "</p></div>";
      html += '<div class="field"><span class="label">핵심 용어</span><dl class="terms">' + m.terms.map(t => "<div><dt>" + esc(t[0]) + "</dt><dd>" + esc(t[1]) + "</dd></div>").join("") + "</dl></div>";
      html += '<div class="field"><span class="label">할 수 있게 되면 체크</span><ul class="checks">' + m.checks.map((c, i) => {
        const key = m.id + "-" + i;
        return '<li><label for="chk-' + key + '"><input type="checkbox" id="chk-' + key + '" data-key="' + key + '"' + (state.checks[key] ? " checked" : "") + (editable() ? "" : " disabled") + "><span>" + esc(c) + "</span></label></li>";
      }).join("") + "</ul></div>";
      html += "</div><div class=\"col\">";
      const pr = m.project;
      html += '<div class="project"><span class="label">실습 프로젝트</span><h3>' + esc(pr.title) + "</h3><p>" + esc(pr.goal) + '</p><div class="tools">' + pr.tools.map(t => "<span>" + esc(t) + "</span>").join("") + "</div><ol>" + pr.steps.map(s => "<li>" + esc(s) + "</li>").join("") + '</ol><p class="done-when"><b>완성 기준</b> ' + esc(pr.doneWhen) + '</p><p class="cost">' + esc(pr.cost) + "</p>";
      if (editable()) {
        html += '<div class="field"><label class="label" for="link-' + m.id + '">결과물 링크 (GitHub 등)</label><input type="url" id="link-' + m.id + '" data-link="' + m.id + '" placeholder="https://github.com/..." value="' + esc(state.links[m.id] || "") + '"></div>';
      } else if (/^https:\/\//.test(state.links[m.id] || "")) {
        html += '<p><a data-linkout="' + m.id + '" target="_blank" rel="noopener">결과물 보기</a></p>';
      }
      html += "</div>";
      html += '<div class="field"><label class="label" for="note-' + m.id + '">내가 정리한 내용</label>';
      if (editable()) {
        html += '<textarea id="note-' + m.id + '" data-note="' + m.id + '" placeholder="배운 개념을 내 말로 다시 써 보세요. 막혔던 부분과 해결 방법도 적어 두면 면접 때 큰 도움이 돼요."></textarea>';
      } else if ((state.notes[m.id] || "").trim()) {
        html += '<div class="note-view" data-noteview="' + m.id + '"></div>';
      } else {
        html += '<p class="note-empty">아직 정리한 내용이 없어요.</p>';
      }
      html += "</div></div></div></section>";
    });

    html += '<footer>이 페이지의 체크와 노트는 저장할 때 페이지에 함께 기록돼요. 링크를 받은 사람은 읽기 전용으로 봅니다. 가격·버전 정보는 공부할 때 공식 문서에서 다시 확인하세요.</footer>';
    html += "</div>";

    const pending = readPending();
    if (editable() && (dirty() || message)) {
      html += '<div class="savebar" role="status"><span id="save-msg">' + esc(message || "저장하지 않은 변경사항이 있어요") + "</span>" +
        (dirty() ? '<button type="button" class="sec" id="discard">되돌리기</button><button type="button" id="save"' + (saving || mode === "local" ? " disabled" : "") + ">" + (saving ? "저장 중…" : "저장하기") + "</button>" : "") + "</div>";
    } else if (editable() && pending && pending !== savedJSON) {
      html += '<div class="savebar" role="status"><span>지난번에 저장하지 못한 변경사항이 있어요</span><button type="button" class="sec" id="drop-pending">버리기</button><button type="button" id="restore">복원하기</button></div>';
    }

    const scrollY = window.scrollY;
    const focusId = document.activeElement && document.activeElement.id;
    const sel = focusId && document.activeElement.selectionStart;
    app.innerHTML = html;

    app.querySelectorAll("[data-note]").forEach(t => { t.value = state.notes[t.dataset.note] || ""; });
    app.querySelectorAll("[data-noteview]").forEach(d => { d.textContent = state.notes[d.dataset.noteview]; });
    app.querySelectorAll("[data-linkout]").forEach(a => { a.href = state.links[a.dataset.linkout]; });
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); try { if (sel != null && el.setSelectionRange) el.setSelectionRange(sel, sel); } catch (e) {} } }
    window.scrollTo(0, scrollY);
  }

  function readPending() { try { return sessionStorage.getItem(PENDING_KEY); } catch (e) { return null; } }
  function writePending(v) { try { if (v == null) sessionStorage.removeItem(PENDING_KEY); else sessionStorage.setItem(PENDING_KEY, v); } catch (e) {} }

  // 노트 입력 중에는 전체를 다시 그리지 않고 저장 바만 갱신
  let typingTimer = null;
  app.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.note) state.notes[t.dataset.note] = t.value;
    else if (t.dataset.link) state.links[t.dataset.link] = t.value.trim();
    else return;
    message = "";
    clearTimeout(typingTimer);
    typingTimer = setTimeout(render, 400);
  });
  app.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.key) { if (t.checked) state.checks[t.dataset.key] = true; else delete state.checks[t.dataset.key]; message = ""; render(); }
  });
  app.addEventListener("click", e => {
    const id = e.target.id;
    if (id === "toggle-preview") { preview = !preview; render(); }
    else if (id === "discard") { state = JSON.parse(savedJSON); message = ""; render(); }
    else if (id === "save") save();
    else if (id === "restore") { try { state = JSON.parse(readPending()); } catch (err) {} writePending(null); render(); }
    else if (id === "drop-pending") { writePending(null); render(); }
  });

  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  function buildDoc(s) {
    const css = document.getElementById("page-css").textContent;
    const js = document.getElementById("page-js").textContent;
    const json = JSON.stringify(s).replace(/</g, "\\u003c");
    const S = "script";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + "</style></head><body>" +
      "<title>AI 인프라 운영 및 설계</title>\n" +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">\n' +
      '<style id="page-css">' + css + "</style>\n\n" +
      '<div id="app"></div>\n\n' +
      "<" + S + ' type="application/json" id="state">' + json + "</" + S + ">\n\n" +
      "<" + S + ' id="page-js">' + js + "</" + S + ">\n</body></html>";
  }

  async function save() {
    if (!artifactApi || saving) return;
    saving = true; message = "저장 중…"; render();
    const next = Object.assign({}, state, { updated: today() });
    const nextJSON = JSON.stringify(next);
    writePending(nextJSON);
    try {
      await artifactApi.publish(buildDoc(next));
      message = "저장했어요";
    } catch (err) {
      const code = err && err.code;
      if (code === "conflict") message = "다른 곳에서 먼저 저장된 버전이 있어 새로 불러와요. 아래에 복원 버튼이 나오면 눌러 주세요.";
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") { mode = "view"; preview = false; message = ""; }
      else if (code === "rate_limited") message = "저장을 너무 자주 했어요. 잠시 후 다시 눌러 주세요.";
      else if (code === "too_large") message = "노트가 너무 길어 저장하지 못했어요. 조금 줄여 주세요.";
      else message = "저장하지 못했어요. 잠시 후 다시 눌러 주세요.";
    }
    saving = false; render();
  }

  // 저장된 상태로 다시 열렸다면 보관해 둔 변경사항은 지우기
  if (readPending() === savedJSON) writePending(null);
  render();

  (async function init() {
    if (!window.claude || !window.claude.use) { mode = "local"; message = "저장은 claude.ai에서 열었을 때만 돼요"; render(); return; }
    const [art, usr] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    artifactApi = art;
    let canEdit = false;
    if (usr) { try { canEdit = await usr.canEdit(); } catch (e) { canEdit = false; } }
    if (art && canEdit) { mode = "edit"; message = ""; }
    else mode = "view";
    render();
  })();
})();
</script>

</body></html>
